<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme — sign in</title>
<style>
  :root {
    color-scheme: dark;
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface: #313244; --overlay: #45475a;
    --text: #cdd6f4; --subtext: #a6adc8; --muted: #6c7086;
    --mauve: #cba6f7; --blue: #89b4fa; --green: #a6e3a1;
  }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100vh; background: var(--base); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center; padding: 48px 24px;
  }
  [hidden] { display: none !important }

  #signin-card {
    width: 380px; padding: 28px; background: var(--mantle);
    border: 1px solid var(--surface); border-radius: 12px;
    box-shadow: 0 18px 40px rgb(0 0 0 / .35);
  }
  #signin-card h1 { font-size: 1.3rem; line-height: 1.25; margin: 0 0 .35rem }
  #signin-subtitle { margin: 0 0 1.4rem; color: var(--subtext); font-size: .9rem }
  .field { margin-bottom: .9rem }
  label { display: block; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .3rem }
  input {
    width: 100%; padding: .6rem .7rem; border-radius: 8px; font: inherit;
    background: var(--crust); color: var(--text); border: 1px solid var(--overlay);
  }
  input::placeholder { color: var(--muted) }
  input:focus { outline: 2px solid var(--mauve); outline-offset: 1px }
  #signin-actions { margin-top: 1.2rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem }
  #submit {
    font: inherit; font-weight: 600; padding: .58rem 1.1rem; border: 0; border-radius: 8px;
    background: var(--mauve); color: var(--crust); cursor: pointer;
  }
  #forgot { color: var(--blue); font-size: .82rem; text-decoration: none }
  #signin-footnote { margin: 1.4rem 0 0; color: var(--muted); font-size: .72rem; line-height: 1.45 }
  #signin-error { margin: .9rem 0 0; color: #f38ba8; font-size: .82rem }

  #magic-link-block { margin-bottom: .2rem }
  #magic-note { margin: 0 0 .7rem; color: var(--subtext); font-size: .85rem }
  #magic-link {
    font: inherit; font-weight: 600; width: 100%; padding: .55rem 1rem; cursor: pointer;
    background: var(--crust); color: var(--text); border: 1px solid var(--overlay); border-radius: 8px;
  }
  #magic-sent { margin: .7rem 0 0; color: var(--green); font-size: .8rem }

  #dashboard { width: min(720px, 100%) }
  #dashboard-title { margin: 0 0 .25rem; font-size: 1.5rem }
  #dashboard-subtitle { margin: 0 0 1.6rem; color: var(--subtext); font-size: .9rem }
  #dashboard-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem; margin-bottom: 1.6rem }
  .tile { padding: 1rem; background: var(--mantle); border: 1px solid var(--surface); border-radius: 10px }
  .tile h2 { margin: 0 0 .2rem; font-size: .85rem; color: var(--subtext); font-weight: 500 }
  .tile p { margin: 0; font-size: 1.25rem; font-weight: 600 }
  #signout {
    font: inherit; padding: .5rem .9rem; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--subtext); border: 1px solid var(--overlay);
  }
</style>
</head>
<body data-variant="__VARIANT__">
  <main id="signin-card">
    <h1 id="signin-title">Welcome back</h1>
    <p id="signin-subtitle">Sign in to your Acme workspace.</p>
    <form id="signin-form" novalidate>
      <div class="field" id="email-field">
        <label id="email-label" for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@acme.example">
      </div>
      <div class="field" id="password-field">
        <label id="password-label" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <div id="signin-actions">
        <button id="submit" type="submit">Sign in</button>
        <a id="forgot" href="#">Forgot password?</a>
      </div>
      <p id="signin-error" hidden>That email and password do not match.</p>
    </form>
    <p id="signin-footnote">By signing in you agree to the acceptable use policy.</p>
  </main>

  <section id="dashboard" hidden>
    <h1 id="dashboard-title">Your workspace</h1>
    <p id="dashboard-subtitle"><span id="dashboard-prefix">Signed in as</span> <span id="dashboard-email"></span></p>
    <div id="dashboard-cards">
      <article class="tile"><h2>Projects</h2><p>4 active</p></article>
      <article class="tile"><h2>Members</h2><p>12 people</p></article>
      <article class="tile"><h2>Usage</h2><p>62% of plan</p></article>
    </div>
    <button id="signout" type="button">Sign out</button>
  </section>

<script>
// A demo app small enough to read in one sitting: a sign-in card, a workspace
// behind it, and the copy in two languages. Two axes are inputs, not code:
//
//   ?lang=en|nb      the UI language (the plan pins `locale`; the page's
//                    <html lang> has to agree or the capture is refused)
//   data-variant     which build of the app is being served — `current`,
//                    `refreshed` (a copy-only change) or `broken` (the password
//                    field replaced by an emailed link). The server picks it
//                    (scripts/serve-example.mjs); no plan knows it exists.
const COPY = {
  en: {
    title: 'Welcome back',
    subtitle: 'Sign in to your Acme workspace.',
    email: 'Email',
    password: 'Password',
    submit: 'Sign in',
    forgot: 'Forgot password?',
    footnote: 'By signing in you agree to the acceptable use policy.',
    dashboardTitle: 'Your workspace',
    dashboardSubtitle: 'Signed in as',
    signout: 'Sign out',
    magicNote: 'We email you a link instead — no password needed.',
    magicButton: 'Email me a sign-in link',
    magicSent: 'If that address has an account, the link is on its way.',
  },
  nb: {
    title: 'Velkommen tilbake',
    subtitle: 'Logg inn på Acme-arbeidsområdet ditt.',
    email: 'E-post',
    password: 'Passord',
    submit: 'Logg inn',
    forgot: 'Glemt passord?',
    footnote: 'Ved å logge inn godtar du retningslinjene for akseptabel bruk.',
    dashboardTitle: 'Arbeidsområdet ditt',
    dashboardSubtitle: 'Innlogget som',
    signout: 'Logg ut',
    magicNote: 'Vi sender deg en lenke i stedet — du trenger ikke passord.',
    magicButton: 'Send meg en innloggingslenke',
    magicSent: 'Har adressen en konto, er lenken på vei.',
  },
};

// The copy-only change: someone rewrote the sentences and the button, and every
// id the plan depends on still exists. This is the run that only refreshes its
// figures.
const REFRESHED = {
  en: { title: 'Sign in to Acme', subtitle: 'Use your work email and password.', submit: 'Continue' },
  nb: { title: 'Logg inn i Acme', subtitle: 'Bruk jobb-e-posten og passordet ditt.', submit: 'Fortsett' },
};

const params = new URLSearchParams(location.search);
const lang = params.get('lang') === 'nb' ? 'nb' : 'en';
const variant = document.body.dataset.variant || 'current';

document.documentElement.lang = lang;
document.title = `${COPY[lang].title} — Acme`;

const $ = (id) => document.getElementById(id);
const copy = { ...COPY[lang], ...(variant === 'refreshed' ? REFRESHED[lang] : {}) };

$('signin-title').textContent = copy.title;
$('signin-subtitle').textContent = copy.subtitle;
$('email-label').textContent = copy.email;
$('password-label').textContent = copy.password;
$('submit').textContent = copy.submit;
$('forgot').textContent = copy.forgot;
$('signin-footnote').textContent = copy.footnote;
$('dashboard-title').textContent = copy.dashboardTitle;
$('dashboard-prefix').textContent = copy.dashboardSubtitle;
$('signout').textContent = copy.signout;

if (variant === 'broken') {
  // What the app looks like after the sign-in flow changed: the password field
  // is gone and a link by email replaces it. A plan that only takes pictures
  // would ship this screen; a plan that requires #password fails instead.
  $('password-field').remove();
  $('submit').remove();

  const block = document.createElement('div');
  block.id = 'magic-link-block';
  block.innerHTML = `<p id="magic-note"></p><button id="magic-link" type="button"></button><p id="magic-sent" hidden></p>`;
  $('signin-actions').before(block);
  $('magic-note').textContent = copy.magicNote;
  $('magic-link').textContent = copy.magicButton;
  $('magic-sent').textContent = copy.magicSent;
  $('magic-link').addEventListener('click', () => {
    $('magic-sent').hidden = false;
    $('magic-link').disabled = true;
  });
}

$('signin-form').addEventListener('submit', (event) => {
  event.preventDefault();
  $('dashboard-email').textContent = $('email').value || 'you@acme.example';
  $('signin-card').hidden = true;
  $('dashboard').hidden = false;
});

$('signout').addEventListener('click', () => {
  $('dashboard').hidden = true;
  $('signin-card').hidden = false;
});
</script>
</body>
</html>
