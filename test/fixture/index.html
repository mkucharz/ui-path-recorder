<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture app — path-shots self-test</title>
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100vh; background: #0b0e14; color: #cfd6e4;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; place-items: center;
  }
  /* Deliberately narrow: a subject that is a small minority of the viewport is
     what makes --no-trim versus trim worth testing. */
  #card { width: 360px; padding: 28px; background: #12161f; border: 1px solid #202839; border-radius: 10px }
  h1 { font-size: 1.15rem; margin: 0 0 .35rem }
  p { margin: 0 0 1rem; color: #8b95a7 }
  label { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: #7d8799; margin-bottom: .25rem }
  input {
    width: 100%; margin-bottom: .85rem; padding: .55rem .65rem; border-radius: 6px;
    border: 1px solid #2b3446; background: #0d1118; color: #cfd6e4; font: inherit;
  }
  button {
    font: inherit; padding: .55rem .9rem; border-radius: 6px; border: 1px solid #2f6feb;
    background: #1f4fbf; color: #fff; cursor: pointer;
  }
  code { background: #1b2130; padding: .05rem .3rem; border-radius: 3px; font-size: .85rem }
  /* The flash: painted visible, hidden once the page's own script boots. */
  #flash-bar {
    position: fixed; top: 0; left: 0; right: 0; padding: .6rem 1rem;
    background: #7f1d1d; color: #fff; font-size: .85rem;
  }
  #cookie-banner {
    position: fixed; bottom: 0; left: 0; right: 0; padding: .75rem 1rem;
    background: #1b2130; border-top: 1px solid #202839;
    display: flex; gap: 1rem; align-items: center; justify-content: flex-end;
    font-size: .85rem;
  }
  #cookie-banner button { background: #2b3446; border-color: #3a4560 }
  [hidden] { display: none !important }
</style>
</head>
<body>
<div id="flash-bar" hidden>Delete selected</div>

<main id="card">
  <h1 id="title">Welcome back</h1>
  <p id="subtitle">Sign in to continue.</p>

  <form id="signin" onsubmit="return false">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="off" placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="off" value="">
    <button id="submit" type="button">Sign in</button>
  </form>

  <section id="step2" hidden>
    <h1>Step 2 — choose a target</h1>
    <p>The installer will create four services.</p>
    <button id="next" type="button">Deploy</button>
  </section>

  <section id="done" hidden>
    <h1>All set</h1>
    <p>Your installation is ready.</p>
    <p>Admin password: <code id="secret">t0ken-fixture-4f9a2c</code></p>
  </section>
</main>

<div id="cookie-banner">
  <span>We use cookies.</span>
  <button id="cookie-deny" type="button">Deny all</button>
</div>

<script>
  const params = new URLSearchParams(location.search);

  // 1. The flash, on request only: a bulk-action bar painted visible and hidden
  //    again by the page's own script. `?flash=1` is for the waitHidden
  //    self-test; a walkthrough a reader watches should not open on a bar the
  //    app never shows them.
  if (params.get('flash') === '1') {
    const bar = document.getElementById('flash-bar');
    bar.hidden = false;
    setTimeout(() => { bar.hidden = true; }, 400);
  }

  // 2. The cookie banner, dismissed before any figure is taken.
  document.getElementById('cookie-deny').addEventListener('click', () => {
    document.getElementById('cookie-banner').hidden = true;
  });

  // 3. A two-step form: the second screen replaces the first in place, so a plan
  //    has to wait for text rather than for a URL.
  document.getElementById('submit').addEventListener('click', () => {
    document.getElementById('signin').hidden = true;
    document.getElementById('title').textContent = 'Step 2 — choose a target';
    document.getElementById('subtitle').textContent = 'The installer will create four services.';
    document.getElementById('step2').hidden = false;
  });
  document.getElementById('next').addEventListener('click', () => {
    document.getElementById('step2').hidden = true;
    document.getElementById('title').textContent = 'All set';
    document.getElementById('subtitle').textContent = 'Your installation is ready.';
    document.getElementById('done').hidden = false;
  });

  // 4. A page that paints the other theme, for the theme guard's self-test.
  if (params.get('theme') === 'light') {
    document.body.style.background = '#ffffff';
    document.body.style.color = '#111111';
  }

  // 5. A value that only exists on the page, so a plan can read it (setVar) and
  //    use it later — the shape of a generated password that is shown once.
  const token = params.get('token');
  if (token) {
    // Reached with the value already in hand: the finished view, not the form
    // still sitting underneath it. The `#done` heading is the one on screen, so
    // the card's own title is left alone — rewriting it printed "All set" twice.
    document.getElementById('signin').hidden = true;
    document.getElementById('title').hidden = true;
    document.getElementById('subtitle').hidden = true;
    document.getElementById('done').hidden = false;
    const echo = document.createElement('p');
    echo.id = 'echoed';
    echo.textContent = 'Signed in with ' + token;
    document.getElementById('done').appendChild(echo);
  }
</script>
</body>
</html>
