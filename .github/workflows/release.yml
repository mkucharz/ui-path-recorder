name: release

# A tag is the skill's version.
#
# `npx skills add mkucharz/ui-path-recorder` already works against `main` — the CLI
# discovers a `SKILL.md` at a repository's root — but "works against main" is not a
# version: an agent that ran today and again next month may have run two different
# skills. A tag pins it (`…@v0.2.0`), which is what `skills-lock.json` records.
#
# So this workflow turns a tag into a release that carries the skill as one
# tarball: SKILL.md, the CLI, the library, the example app and the reference —
# everything `SKILL.md` points at, and nothing that only builds the site. It also
# re-runs the checks, because a release is the one place a broken `main` would
# become permanent.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to (re)publish'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: the tag is the version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${{ inputs.tag || github.ref_name }}" ]; then
            echo "::error::tag ${{ inputs.tag || github.ref_name }} does not match package.json v$version"
            exit 1
          fi

      - run: npm ci

      - name: install a browser matching playwright-core
        # `npm test` drives the bundled fixture app in a real browser, so the
        # release would fail at the checks without this — and it reads the
        # revision from the installed package rather than pinning it twice, the
        # same shape `ci.yml` and `pages.yml` use.
        run: npx --yes "playwright@$(node -p "require('playwright-core/package.json').version")" install --with-deps chromium ffmpeg

      - name: checks
        run: |
          set -euo pipefail
          npm run check
          npm test
          npm run theme:check

      - name: package the skill
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # `path-recorder/` rather than `ui-path-recorder/`: the directory name is
          # the skill's name, and unpacking into an agent's skills folder has to
          # leave `path-recorder/SKILL.md` behind.
          rm -rf path-recorder dist
          mkdir -p path-recorder dist
          cp SKILL.md LICENSE package.json package-lock.json path-recorder/
          # `plans/` whole, not just the schema: `SKILL.md` tells the agent to
          # start from `plans/examples/railway-installer.plan.json`, and a skill
          # that points at a file it did not ship is worse than one that points
          # nowhere. `test/` stays out — it is the site's fixture app, and no
          # instruction in `SKILL.md` names it.
          cp -r scripts lib examples themes references plans path-recorder/
          # `package.json` + the lockfile are here so the folder-install path can
          # resolve `playwright-core`: an unpacked skill has no `node_modules`, and
          # without a manifest `npm install` has nothing to read.
          tar -czf "dist/path-recorder-skill-v$version.tar.gz" path-recorder
          (cd dist && sha256sum "path-recorder-skill-v$version.tar.gz" > "path-recorder-skill-v$version.tar.gz.sha256")
          tar -tzf "dist/path-recorder-skill-v$version.tar.gz" | sed -n '1,12p'
          du -sh dist/*

      - name: the tarball carries what SKILL.md points at
        run: |
          set -euo pipefail
          # Every relative path SKILL.md names has to be inside the pack. This is
          # the check that would have caught the first cut shipping the schema and
          # not one of the six example plans.
          tar -xzf dist/path-recorder-skill-v*.tar.gz -C /tmp
          cd /tmp/path-recorder
          missing=0
          while read -r ref; do
            [ -e "$ref" ] || { echo "::error::SKILL.md points at $ref, which the pack does not carry"; missing=1; }
          done < <(grep -oE '`(plans|references|examples|scripts|lib|themes)/[a-zA-Z0-9_./-]+`' SKILL.md | tr -d '`' | sort -u)
          [ "$missing" -eq 0 ]

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          notes="**The skill, pinned.** \`npx skills add mkucharz/ui-path-recorder@v$version --skill path-recorder -g\` installs this tag; the tarball below unpacks to \`path-recorder/SKILL.md\` for any agent that installs by folder."
          # `--generate-notes` would compete with `--notes` for the body, and gh
          # keeps one silently. One deterministic body beats an ambiguous merge.
          # The dispatch input says "(re)publish", so an existing release is
          # edited rather than refused.
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release edit "v$version" --title "v$version" --notes "$notes"
            gh release upload "v$version" dist/* --clobber
          else
            gh release create "v$version" dist/* --title "v$version" --notes "$notes"
          fi
